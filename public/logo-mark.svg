<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 206 178.4" role="img" aria-label="NØRR3">
  <title>NØRR3</title>
  <!-- The NØRR3 mark: an equilateral triangle outline of uniform thickness.
       This is the shape the numeral 3 morphs into in logo-animated.svg — the
       geometry here was measured off that animation's held state (a uniform
       32.2-unit inset on a 206-wide triangle) and then re-authored cleanly, so
       it stays crisp at favicon sizes instead of carrying the morph's hundreds
       of polyline points. -->
  <path fill="#7016cb" fill-rule="evenodd" d="M103 0 206 178.4H0Zm0 64.4-47.23 81.8h94.46Z"/>
</svg>
